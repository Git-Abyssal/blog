map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # 限制上传大小为 10MB（与后端 Spring Boot 配置一致）
    client_max_body_size 10M;

    # Use one consistent set of security headers for both static and proxied
    # responses instead of forwarding a second, conflicting set from Spring.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    location / {
        root /usr/share/nginx/html/site;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 反向代理后端接口
    location /api {
        proxy_pass http://blog-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Keep the full proxy chain. The backend resolves it from right to left
        # and ignores client-controlled entries before the first untrusted hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Uploads are read from a read-only volume. No storage API is exposed.
    location ^~ /storage/blog-images/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        root /srv;
        try_files $uri =404;
        autoindex off;
        expires 7d;
    }

    location ^~ /storage/ {
        return 404;
    }

    # Production API documentation is disabled by Spring Security. Return an
    # explicit 404 instead of falling back to the public SPA.
    location ^~ /swagger-ui/ {
        return 404;
    }

    location = /swagger-ui.html {
        return 404;
    }

    location ^~ /v3/api-docs {
        return 404;
    }

    # Public RSS feeds are served by Spring Boot rather than the SPA fallback.
    location /rss {
        proxy_pass http://blog-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass http://blog-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /robots.txt {
        proxy_pass http://blog-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
