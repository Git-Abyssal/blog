    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
jwt:
  # For development only. Generate with: openssl rand -base64 64
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHktZ2VuZXJhdGUtbmV3LWZvci1wcm9kdWN0aW9uLXVzZS1vcGVuc3NsLXJhbmQtYmFzZTY0LTY0LWJ5dGVzLW1pbmltdW0=}
