spring:
  datasource:
    url: jdbc:mysql://mysql:3306/blog_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

jwt:
  # IMPORTANT: Must be Base64-encoded! Generate with: openssl rand -base64 64
  secret: ${JWT_SECRET}
  # Minimum 256 bits when decoded. Use: openssl rand -base64 64

# Production CORS Configuration
# SECURITY: Must set CORS_ORIGIN_PATTERNS environment variable
# Example: https://yourblog.com,https://www.yourblog.com
# WARNING: Empty value will block all requests - set explicit origins!
cors:
  allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:}

# Production Cookie Security Configuration
# Must use secure cookies in production
app:
  cookie:
    secure: true  # Must be true for production (HTTPS)
    same-site: Strict  # Strict for production
